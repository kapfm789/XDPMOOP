# Phục vụ bản build của admin hoặc pos trong gói demo (W5-04).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Ứng dụng một trang: route nào không phải file thì trả index.html để React Router xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File có mã băm trong tên: giữ cache lâu.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker và manifest của pos luôn được tải lại, để bản build mới thay được app shell đã cache.
    location ~ ^/(sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }
}
