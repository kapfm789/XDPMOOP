<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1677ff" />
    <title>OISM POS</title>
    <!-- PWA: cài lên màn hình chính (docs/design/ui/pos.md mục "PWA"). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Font Inter như admin; không tải được thì dùng font hệ thống trong theme. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Hóa đơn và phiếu thanh toán in qua trình duyệt: chỉ in phần cần in, không in thanh tiêu đề và nút bấm. */
      .print-only {
        display: none;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        body,
        .ant-layout {
          background: #fff !important;
        }
        .receipt-card {
          border: none !important;
          box-shadow: none !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; background: #f5f7fa; font-family: Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
