<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OISM Quản trị</title>
    <!-- Font Inter theo bản Figma; không tải được thì dùng font hệ thống trong theme. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Phiếu giao hàng in qua trình duyệt: chỉ in vùng print-only, ẩn menu, thanh tiêu đề và phần còn lại của màn hình. */
      .print-only {
        display: none;
      }
      @media print {
        .no-print,
        .ant-layout-sider,
        .ant-layout-header {
          display: none !important;
        }
        .print-only {
          display: block;
        }
      }
    </style>
  </head>
  <body style="margin: 0; background: #f5f7fa; font-family: Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
