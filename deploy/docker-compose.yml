# Compose cho máy dev (W1-03). Máy chỉ cần Docker; mã nguồn backend được mount vào container SDK, mỗi lần
# container khởi động là build rồi chạy, không build image.
# Chạy từ gốc repo: docker compose -f deploy/docker-compose.yml up -d
# Đang code service nào thì mở thêm một terminal để lưu file là service đó tự build và khởi động lại:
#   docker compose -f deploy/docker-compose.yml watch core
# Không chạy `watch` thì khởi động lại bằng tay: docker compose -f deploy/docker-compose.yml restart core
# Tên, cổng, tiền tố route: docs/architecture/context-and-containers.md mục "Địa chỉ và cổng".
name: oism

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Development
  Jwt__PublicKey: ${JWT_PUBLIC_KEY:-}
  # bin/obj nằm trong container, không lẫn với bin/obj do IDE build trên máy host.
  # ponytail: mất khi `down`, lần `up` sau build lại từ đầu; cần nhanh hơn thì đưa vào volume riêng từng service.
  ArtifactsPath: /artifacts
  # Thư mục khóa của NuGet nằm trong volume chung; thiếu nó thì các container restore cùng lúc giẫm lên nhau.
  NUGET_SCRATCH: /root/.nuget/packages/.scratch
  # Build xong thì tiến trình MSBuild và trình biên dịch thoát luôn thay vì nằm chờ, để 6 container không giữ RAM.
  MSBUILDDISABLENODEREUSE: 1
  UseSharedCompilation: false

x-dotnet: &dotnet
  image: mcr.microsoft.com/dotnet/sdk:8.0
  restart: unless-stopped
  # Mỗi service đặt working_dir là thư mục project; tên thư mục cũng là tên file chạy trong /artifacts.
  # exec để sau khi build chỉ còn đúng một tiến trình là service. Build lỗi thì nằm chờ lần khởi động lại sau,
  # không thoát để restart policy build lại liên tục; lúc đó health check báo unhealthy và lỗi nằm ở `logs`.
  # Không dùng `dotnet watch`: thư mục mount từ Windows không phát inotify nên nó quét file nửa giây một lần,
  # 6 container cùng quét ngốn khoảng 2 nhân CPU cả lúc rảnh. `compose watch` theo dõi file ở phía máy host.
  command: ["sh", "-c", "dotnet build || exec sleep infinity; exec /artifacts/bin/$${PWD##*/}/debug/$${PWD##*/}"]
  # Để tiến trình số 1 chuyển SIGTERM xuống, service dừng ngay khi restart thay vì chờ hết 10 giây.
  init: true
  environment: *dotnet-env
  volumes:
    - ../backend:/src
    - nuget-packages:/root/.nuget/packages
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 10s
    timeout: 3s
    retries: 5
    # Lần chạy đầu phải tải package và build trong container.
    start_period: 300s

x-service: &service
  <<: *dotnet
  environment: &service-env
    <<: *dotnet-env
    ConnectionStrings__Oism: Host=postgres;Database=oism;Username=${POSTGRES_USER:-oism};Password=${POSTGRES_PASSWORD:-oism}
    # Không chờ rabbitmq khỏe: service vẫn commit khi broker tắt, outbox gửi bù sau (docs/architecture/messaging.md).
    ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-oism}:${RABBITMQ_PASSWORD:-oism}@rabbitmq:5672
  depends_on:
    postgres:
      condition: service_healthy

# Đường dẫn cho `compose watch`: bin/obj do IDE build trên máy host và project test không làm service khởi động lại.
x-watch-ignore: &watch-ignore ["**/bin/", "**/obj/", "tests/"]
x-watch-shared: &watch-shared
  action: restart
  path: ../backend/shared
  ignore: *watch-ignore

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oism
      POSTGRES_USER: ${POSTGRES_USER:-oism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oism}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      # -h localhost: chỉ báo sẵn sàng khi server thật đã nghe TCP, không phải server tạm lúc chạy init script.
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d oism"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-oism}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-oism}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    <<: *dotnet
    working_dir: /src/gateway/Oism.Gateway
    develop:
      watch:
        - { action: restart, path: ../backend/gateway, ignore: *watch-ignore }
        - *watch-shared
    ports:
      - "8080:8080"

  identity:
    <<: *service
    environment:
      <<: *service-env
      # Khóa bí mật ký JWT chỉ cấp cho identity; các service khác chỉ nhận khóa công khai.
      Jwt__PrivateKey: ${JWT_PRIVATE_KEY:-}
    working_dir: /src/services/identity/src/Oism.Identity.Api
    develop:
      watch:
        - { action: restart, path: ../backend/services/identity/src, ignore: *watch-ignore }
        - *watch-shared
    ports:
      - "5101:8080"

  catalog:
    <<: *service
    working_dir: /src/services/catalog/src/Oism.Catalog.Api
    develop:
      watch:
        - { action: restart, path: ../backend/services/catalog/src, ignore: *watch-ignore }
        - *watch-shared
    ports:
      - "5102:8080"

  core:
    <<: *service
    working_dir: /src/services/core/src/Oism.Core.Api
    develop:
      watch:
        - { action: restart, path: ../backend/services/core/src, ignore: *watch-ignore }
        - *watch-shared
    ports:
      - "5103:8080"

  channel:
    <<: *service
    working_dir: /src/services/channel/src/Oism.Channel.Api
    develop:
      watch:
        - { action: restart, path: ../backend/services/channel/src, ignore: *watch-ignore }
        - *watch-shared
    ports:
      - "5104:8080"

  insights:
    <<: *service
    working_dir: /src/services/insights/src/Oism.Insights.Api
    develop:
      watch:
        - { action: restart, path: ../backend/services/insights/src, ignore: *watch-ignore }
        - *watch-shared
    ports:
      - "5105:8080"

  # Build và chạy toàn bộ test mà không cần cài .NET. Không khởi động cùng `up`:
  # docker compose -f deploy/docker-compose.yml run --rm tests
  tests:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: [test]
    working_dir: /src
    environment:
      # Testcontainers chạy container PostgreSQL cạnh container này, nên phải đi qua máy host.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/repo:ro
      - nuget-packages:/root/.nuget/packages
      - /var/run/docker.sock:/var/run/docker.sock
      # Script đo coverage của core (W5-01): docs/testing/coverage.md.
      - ../tools:/tools:ro
    command: ["bash", "-c", "cp -r /repo/. /src && dotnet test Oism.sln"]

  # Seed data (W4-09), chạy lặp lại được mà không tạo bản trùng. Không khởi động cùng `up`; chạy sau khi các service
  # đã khỏe: docker compose -f deploy/docker-compose.yml run --rm seed
  # Đây là việc chạy một lần rồi thoát nên không có health check và không tự khởi động lại. Chi tiết: deploy/seed/README.md.
  seed:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: [seed]
    restart: "no"
    working_dir: /src/deploy/seed
    environment:
      ArtifactsPath: /artifacts
      NUGET_SCRATCH: /root/.nuget/packages/.scratch
      MSBUILDDISABLENODEREUSE: 1
      UseSharedCompilation: false
      SEED_GATEWAY_URL: http://gateway:8080
      SEED_RABBITMQ: amqp://${RABBITMQ_USER:-oism}:${RABBITMQ_PASSWORD:-oism}@rabbitmq:5672
      SEED_PASSWORD: ${SEED_PASSWORD:-Demo@2026}
    volumes:
      - ../backend:/src/backend
      - ./seed:/src/deploy/seed
      - nuget-packages:/root/.nuget/packages
    command: ["dotnet", "run"]
    depends_on:
      gateway:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  nuget-packages:
