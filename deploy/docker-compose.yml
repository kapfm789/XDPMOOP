# Compose cho máy dev (W1-03). Máy chỉ cần Docker; mã nguồn backend được mount vào container SDK và chạy
# bằng `dotnet watch`: sửa code hay thêm migration thì service tự build và khởi động lại, không build image.
# Chạy từ gốc repo: docker compose -f deploy/docker-compose.yml up -d
# Tên, cổng, tiền tố route: docs/architecture/context-and-containers.md mục "Địa chỉ và cổng".
name: oism

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Development
  Jwt__PublicKey: ${JWT_PUBLIC_KEY:-}
  # bin/obj nằm trong container, không lẫn với bin/obj do IDE build trên máy host.
  # ponytail: mất khi `down`, lần `up` sau build lại từ đầu; cần nhanh hơn thì đưa vào volume riêng từng service.
  ArtifactsPath: /artifacts
  # Thư mục khóa của NuGet nằm trong volume chung; thiếu nó thì các container restore cùng lúc giẫm lên nhau.
  NUGET_SCRATCH: /root/.nuget/packages/.scratch
  # Build xong thì tiến trình MSBuild và trình biên dịch thoát luôn thay vì nằm chờ, để 6 container không giữ RAM.
  MSBUILDDISABLENODEREUSE: 1
  UseSharedCompilation: false

x-dotnet: &dotnet
  image: mcr.microsoft.com/dotnet/sdk:8.0
  restart: unless-stopped
  working_dir: /src
  environment: *dotnet-env
  volumes:
    - ../backend:/src
    - nuget-packages:/root/.nuget/packages
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 10s
    timeout: 3s
    retries: 5
    # Lần chạy đầu phải tải package và build trong container.
    start_period: 300s

x-service: &service
  <<: *dotnet
  environment:
    <<: *dotnet-env
    ConnectionStrings__Oism: Host=postgres;Database=oism;Username=${POSTGRES_USER:-oism};Password=${POSTGRES_PASSWORD:-oism}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oism
      POSTGRES_USER: ${POSTGRES_USER:-oism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oism}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      # -h localhost: chỉ báo sẵn sàng khi server thật đã nghe TCP, không phải server tạm lúc chạy init script.
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d oism"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-oism}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-oism}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --no-hot-reload: mỗi lần lưu file là build và khởi động lại, nên migration mới được áp ngay lúc khởi động.
  gateway:
    <<: *dotnet
    command: dotnet watch --no-hot-reload --project gateway/Oism.Gateway
    ports:
      - "8080:8080"

  identity:
    <<: *service
    command: dotnet watch --no-hot-reload --project services/identity/src/Oism.Identity.Api
    ports:
      - "5101:8080"

  catalog:
    <<: *service
    command: dotnet watch --no-hot-reload --project services/catalog/src/Oism.Catalog.Api
    ports:
      - "5102:8080"

  core:
    <<: *service
    command: dotnet watch --no-hot-reload --project services/core/src/Oism.Core.Api
    ports:
      - "5103:8080"

  channel:
    <<: *service
    command: dotnet watch --no-hot-reload --project services/channel/src/Oism.Channel.Api
    ports:
      - "5104:8080"

  insights:
    <<: *service
    command: dotnet watch --no-hot-reload --project services/insights/src/Oism.Insights.Api
    ports:
      - "5105:8080"

  # Build và chạy toàn bộ test mà không cần cài .NET. Không khởi động cùng `up`:
  # docker compose -f deploy/docker-compose.yml run --rm tests
  tests:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: [test]
    working_dir: /src
    environment:
      # Testcontainers chạy container PostgreSQL cạnh container này, nên phải đi qua máy host.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/repo:ro
      - nuget-packages:/root/.nuget/packages
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["bash", "-c", "cp -r /repo/. /src && dotnet test Oism.sln"]

volumes:
  postgres-data:
  nuget-packages:
